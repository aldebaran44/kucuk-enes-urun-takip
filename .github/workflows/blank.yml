name: Urun Takip Otomasyonu

on:
  schedule:
    - cron: '0 */6 * * *' # Her 6 saatte bir otomatik çalışır
  workflow_dispatch: # İstersen el ile de çalıştırabilirsin

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depodaki Kodları İndir
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Python Kodunu Çalıştır
        run: python cücük2.ipynb
